[package]
name = "grid-hype"
version = "0.1.0"
edition = "2024"
description = "Generalized Hyperliquid Maker Grid Arbitrage Engine built on NautilusTrader (Rust)"
license = "MIT"

[dependencies]
nautilus-hyperliquid = "0.68.0"
nautilus-model = "0.68.0"
nautilus-core = "0.68.0"
nautilus-common = "0.68.0"
nautilus-network = "0.68.0"
rust_decimal = "1.36"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
