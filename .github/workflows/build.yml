name: Build and Release Linux AMD64 Binary

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  checks: write

jobs:
  build-linux-amd64:
    name: Build Linux x86_64 Binary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential cmake clang

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: |
          RUST_BACKTRACE=1 cargo test --all-targets --verbose -- --nocapture 2>&1 | tee test_output.log || {
            echo "## ❌ Unit Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "## ✅ Unit Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Release Binary
        run: |
          set -o pipefail
          RUST_BACKTRACE=1 cargo build --release --verbose 2>&1 | tee build_output.log
          mkdir -p dist
          cp target/release/grid-hype dist/grid-hype
          cp config.toml dist/config.toml
          chmod +x dist/grid-hype
          tar -czvf grid-hype-linux-amd64.tar.gz -C dist grid-hype config.toml

      - name: Report Build Failure
        if: failure()
        run: |
          if [ -f build_output.log ]; then
            echo "## ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout --orphan build-logs
            git rm -rf . || true
            cp build_output.log BUILD_LOG.txt
            git add BUILD_LOG.txt
            git commit -m "build failure log [skip ci]"
            git push -f origin build-logs || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-hype-linux-amd64
          path: |
            dist/grid-hype
            dist/config.toml
            grid-hype-linux-amd64.tar.gz
            build_output.log
          retention-days: 30

      - name: Create GitHub Release and Upload Assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.3
          name: "Grid Hype Release v0.2.3 (Native Rust)"
          draft: false
          prerelease: false
          files: |
            dist/grid-hype
            dist/config.toml
            grid-hype-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

