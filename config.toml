# =============================================================================
# Hyperliquid Generic Grid Arbitrage Bot (Native Rust)
# =============================================================================

[grid]
# 标的代币 (Hyperliquid 永续合约, 例如 "HYPE")
symbol = "HYPE"

# 网格方向: "long" (做多网格) 或 "short" (做空网格)
direction = "long"

# 价格区间 (USDC): 55.0 到 65.0
lower_price = 55.0
upper_price = 65.0

# 网格数量: 划分 30 格 (每格间距 = (65 - 55) / 30 = 0.333333 USDC)
grid_count = 30

# 每格下单金额: 1300 USDC
amount_per_grid = 1300.0

# 开仓与平仓均强制使用 Maker (Post-Only / ALO) 节省手续费
post_only = true

# 现价下方最大同时激活的开仓挂单数 (默认 3，0 表示不限制/挂满全部下方网格)
# 仅在现价下方维持最近的 3 格挂单，成交一格再挂一格，大幅节省保证金占用
active_entry_grids = 3

[exchange]
# 是否使用测试网 (false = 主网 Mainnet, true = 测试网 Testnet)
testnet = false

# 私钥环境变量名 (优先读取 HYPERLIQUID_PK，备用 PRIVATE_KEY)
private_key_env = "HYPERLIQUID_PK"

# 主账户地址 (使用 API/Agent 钱包交易时指定持有资金的主账户地址)
account_address = "0x716ce5802be364b1fc17d45bd89ce8bc657ea787"

# 状态巡检与订单对账周期 (秒)
reconcile_interval_secs = 5

# 程序退出时是否自动撤销所有当前挂单
cancel_on_exit = false
